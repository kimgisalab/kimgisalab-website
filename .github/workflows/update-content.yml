name: Update site content

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild site (fetches latest 뉴스클리핑 / 포트폴리오 sheets)
        run: python3 build.py

      - name: Commit and push if content changed
        run: |
          git config user.name "kimgisalab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: auto-update news/portfolio content"
            git push
          fi
